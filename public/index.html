<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 15px; color: #bfd0e5; }
    .auth input { font: inherit; padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; }
    .auth button { font: inherit; font-weight: 700; padding: 10px 14px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; cursor: pointer; justify-self: start; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth-error { margin: 10px 0 0; color: #ffb4c0; }
    .auth-status { margin: 0 0 10px; }
    .auth textarea { font: inherit; min-height: 90px; padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; resize: vertical; }
    .auth .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .auth button.secondary, li button { background: transparent; color: #8ad8df; border: 1px solid #8ad8df; }
    li span { display: block; white-space: pre-wrap; }
    li .actions { display: flex; gap: 8px; margin-top: 10px; }
    li button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 자료 요청을 서버 한곳으로 모읍니다</div>
    <h1>점령된 자료실</h1>
    <p>로그인한 계정은 자기 자료만 보고 고칠 수 있습니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">자료는 로그인한 계정에만 보입니다. 서버가 로그인 토큰을 검사한 뒤에만 자료를 보냅니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <form id="login-form" hidden>
        <label>이메일 <input id="login-email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="login-password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p class="auth-status" id="auth-status"></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p class="auth-error" id="auth-error" role="alert" hidden></p>
    </section>
    <section class="auth" id="editor" aria-labelledby="editor-title" hidden>
      <h2 id="editor-title">가상 메모 추가</h2>
      <form id="note-form">
        <label>제목 <input id="note-title" maxlength="200" required></label>
        <label>내용 <textarea id="note-body" maxlength="10000"></textarea></label>
        <div class="actions">
          <button id="note-save" type="submit">추가</button>
          <button id="note-cancel" class="secondary" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <p class="auth-error" id="note-error" role="alert" hidden></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    // 이 화면에는 Supabase 주소와 키가 없습니다. 로그인은 /api/auth/* 서버 함수로만 합니다.
    // access token은 이 변수(메모리)에만 두고, refresh token은 화면이 읽을 수 없는 HttpOnly 쿠키에 있습니다.

    const form = document.querySelector('#login-form');
    const emailInput = document.querySelector('#login-email');
    const passwordInput = document.querySelector('#login-password');
    const loginButton = document.querySelector('#login-button');
    const signedIn = document.querySelector('#signed-in');
    const authStatus = document.querySelector('#auth-status');
    const logoutButton = document.querySelector('#logout-button');
    const authError = document.querySelector('#auth-error');
    const list = document.querySelector('#notes');
    const editor = document.querySelector('#editor');
    const editorTitle = document.querySelector('#editor-title');
    const noteForm = document.querySelector('#note-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteSave = document.querySelector('#note-save');
    const noteCancel = document.querySelector('#note-cancel');
    const noteError = document.querySelector('#note-error');

    // { access_token, expires_at, user: { email } } 또는 null. 저장소에는 쓰지 않습니다.
    let currentSession = null;
    let editingId = null;

    const showListMessage = message => {
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    };
    const showNoteError = message => {
      noteError.textContent = message;
      noteError.hidden = !message;
    };
    const api = async (path, { method = 'GET', body } = {}, retried = false) => {
      if (!currentSession) throw new Error('로그인하면 자료가 보입니다.');
      const headers = { Authorization: `Bearer ${currentSession.access_token}` };
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {
        method, cache: 'no-store', headers,
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      // access token이 만료됐으면 한 번만 갱신하고 다시 보냅니다.
      if (response.status === 401 && !retried && await refreshSession()) {
        return api(path, { method, body }, true);
      }
      if (response.status === 401 || response.status === 403) {
        throw new Error('로그인을 확인하지 못했습니다. 다시 로그인해 주세요.');
      }
      const data = await response.json().catch(() => null);
      if (response.status === 404) throw new Error('메모를 찾지 못했습니다. 이미 지워졌을 수 있습니다.');
      if (response.status === 400) throw new Error('제목은 1~200자, 내용은 10000자 이하로 적어 주세요.');
      if (!response.ok) throw new Error(`요청을 처리하지 못했습니다. (${data?.error ?? response.status})`);
      return data;
    };
    const resetEditor = () => {
      editingId = null;
      noteForm.reset();
      editorTitle.textContent = '가상 메모 추가';
      noteSave.textContent = '추가';
      noteCancel.hidden = true;
    };
    const startEdit = note => {
      editingId = note.id;
      noteTitle.value = note.title;
      noteBody.value = note.body;
      editorTitle.textContent = '가상 메모 수정';
      noteSave.textContent = '저장';
      noteCancel.hidden = false;
      showNoteError('');
      noteTitle.focus();
    };
    const noteItem = note => {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      const body = document.createElement('span');
      const actions = document.createElement('div');
      const edit = document.createElement('button');
      const remove = document.createElement('button');
      title.textContent = note.title;
      body.textContent = note.body;
      actions.className = 'actions';
      edit.type = remove.type = 'button';
      edit.textContent = '수정';
      remove.textContent = '삭제';
      edit.addEventListener('click', () => startEdit(note));
      remove.addEventListener('click', async () => {
        showNoteError('');
        remove.disabled = true;
        try {
          await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
          if (editingId === note.id) resetEditor();
          await loadNotes();
        } catch (error) {
          remove.disabled = false;
          showNoteError(`삭제 실패: ${error.message}`);
        }
      });
      actions.append(edit, remove);
      item.append(title, body, actions);
      return item;
    };
    // 로그인·로그아웃이 겹치면 마지막 요청의 결과만 화면에 씁니다.
    let notesRequest = 0;
    const loadNotes = async () => {
      const current = ++notesRequest;
      editor.hidden = !currentSession;
      if (!currentSession) {
        resetEditor();
        showNoteError('');
        showListMessage('로그인하면 자료가 보입니다.');
        return;
      }
      showListMessage('가상 자료를 불러오는 중입니다.');
      try {
        const notes = await api('/api/notes');
        if (current !== notesRequest) return;
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) showListMessage('아직 이 계정의 메모가 없습니다. 위에서 추가해 보세요.');
        else list.replaceChildren(...notes.map(noteItem));
      } catch (error) {
        if (current === notesRequest) showListMessage(error.message);
      }
    };

    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      showNoteError('');
      noteSave.disabled = true;
      const note = { title: noteTitle.value, body: noteBody.value };
      try {
        if (editingId) await api(`/api/notes/${encodeURIComponent(editingId)}`, { method: 'PUT', body: note });
        else await api('/api/notes', { method: 'POST', body: note });
        resetEditor();
        await loadNotes();
      } catch (error) {
        showNoteError(`${editingId ? '수정' : '추가'} 실패: ${error.message}`);
      } finally {
        noteSave.disabled = false;
      }
    });
    noteCancel.addEventListener('click', () => {
      resetEditor();
      showNoteError('');
    });

    const showError = message => {
      authError.textContent = message;
      authError.hidden = !message;
    };
    // 서버 함수가 돌려준 오류 코드를 지금까지와 같은 문구로 보여 줍니다.
    const loginErrorMessage = code => {
      const reasons = {
        invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
        email_not_confirmed: '이메일 인증이 끝나지 않은 계정입니다.',
        user_banned: '사용이 정지된 계정입니다.',
        over_request_rate_limit: '로그인 시도가 너무 많습니다. 잠시 뒤 다시 시도하세요.',
        INVALID_LOGIN_REQUEST: '이메일과 비밀번호를 확인해 주세요.',
        AUTH_NOT_CONFIGURED: '로그인 설정이 끝나지 않았습니다. 관리자에게 알려 주세요.',
      };
      if (code === 'AUTH_UNAVAILABLE' || code === 'network') {
        return '로그인 서버에 연결하지 못했습니다. 네트워크를 확인하세요.';
      }
      return `로그인 실패: ${reasons[code] ?? '로그인하지 못했습니다.'}`;
    };
    const render = session => {
      form.hidden = Boolean(session);
      signedIn.hidden = !session;
      authStatus.textContent = session ? `${session.user.email ?? '이'} 계정으로 로그인했습니다.` : '';
    };
    const authPost = (path, extraHeaders = {}, body = {}) => fetch(path, {
      method: 'POST', cache: 'no-store', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', ...extraHeaders },
      body: JSON.stringify(body),
    });

    // 만료 1분 전에 HttpOnly 쿠키로 새 access token을 받습니다. 목록은 다시 부르지 않습니다.
    let refreshTimer = null;
    const setSession = session => {
      currentSession = session;
      clearTimeout(refreshTimer);
      if (Number.isFinite(session?.expires_at)) {
        const seconds = session.expires_at - Math.floor(Date.now() / 1000) - 60;
        refreshTimer = setTimeout(() => refreshSession(), Math.max(10, seconds) * 1000);
      }
      render(session);
    };
    // 갱신 요청이 겹치면 하나만 보냅니다(refresh token은 한 번 쓰면 바뀝니다).
    let refreshing = null;
    const refreshSession = () => refreshing ??= (async () => {
      try {
        const response = await authPost('/api/auth/refresh');
        if (!response.ok) {
          if (currentSession) {
            setSession(null);
            loadNotes();
          }
          return false;
        }
        setSession(await response.json());
        return true;
      } catch {
        return false;
      } finally {
        refreshing = null;
      }
    })();

    form.addEventListener('submit', async event => {
      event.preventDefault();
      showError('');
      loginButton.disabled = true;
      const credentials = { email: emailInput.value.trim(), password: passwordInput.value };
      passwordInput.value = '';
      try {
        const response = await authPost('/api/auth/login', {}, credentials);
        const data = await response.json().catch(() => null);
        if (!response.ok) {
          showError(loginErrorMessage(data?.error));
          return;
        }
        setSession(data);
        loadNotes();
      } catch {
        showError(loginErrorMessage('network'));
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      showError('');
      logoutButton.disabled = true;
      const token = currentSession?.access_token;
      try {
        const response = await authPost('/api/auth/logout', token ? { Authorization: `Bearer ${token}` } : {});
        if (!response.ok) showError('로그아웃 요청이 실패했지만 이 화면에서는 로그아웃했습니다.');
      } catch {
        showError('로그아웃 요청이 실패했지만 이 화면에서는 로그아웃했습니다.');
      } finally {
        logoutButton.disabled = false;
        setSession(null);
        loadNotes();
      }
    });

    // 처음 열 때: HttpOnly 쿠키가 있으면 로그인 상태를 되살리고, 없으면 로그인 폼을 보여 줍니다.
    if (!(await refreshSession())) render(null);
    loadNotes();
  </script>
</body>
</html>
